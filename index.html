<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ryn's Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="shared/blocks.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vmin;
      padding: 4vmin;
    }
    h1 {
      margin: 0;
      font-size: 8vmin;
      color: #555;
      font-weight: 700;
    }
    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 5vmin;
      justify-content: center;
    }
    /* Picture tiles: big, square, one per game. No reading needed. */
    .tile {
      width: 40vmin;
      height: 40vmin;
      border-radius: 5vmin;
      background: white;
      box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 12px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4vmin 3vmin 3vmin;
      text-decoration: none;
      color: #444;
      font-size: 4.5vmin;
      font-weight: 700;
      transition: transform 0.1s;
    }
    .tile:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,0.12); }

    /* The picture area fills the tile; the label sits in its own row below. */
    .tile .picture {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 0;
      margin-bottom: 3vmin;
    }
    .tile .label { line-height: 1; }

    /* A tiny static tower as the Block Buddy icon. */
    .tile .tower { --b: 6vmin; }

    .tile.soon {
      opacity: 0.35;
      pointer-events: none;
      border: 1vmin dashed #bbb;
      background: transparent;
      box-shadow: none;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <h1>Ryn's Games</h1>
  <div class="tiles">
    <a class="tile" href="block-buddy/index.html">
      <div class="picture">
        <div class="tower">
          <div class="col">
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a">
              <div class="face">
                <div class="eye left"><div class="pupil"></div></div>
                <div class="eye right"><div class="pupil"></div></div>
                <div class="mouth"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="label">Block Buddy</div>
    </a>
    <div class="tile soon"><div class="label">coming soon</div></div>
  </div>
  <script>document.addEventListener('contextmenu', e => e.preventDefault());</script>
</body>
</html>
