<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ryn's Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="shared/blocks.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vmin;
      padding: 4vmin;
    }
    h1 {
      margin: 0;
      font-size: 8vmin;
      color: #555;
      font-weight: 700;
      touch-action: none; /* a finger that drifts during the long-press must not become a scroll */
    }
    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 5vmin;
      justify-content: center;
    }
    /* Picture tiles: big, square, one per game. No reading needed. */
    .tile {
      width: 40vmin;
      height: 40vmin;
      border-radius: 5vmin;
      background: white;
      box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 12px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4vmin 3vmin 3vmin;
      text-decoration: none;
      color: #444;
      font-size: 4.5vmin;
      font-weight: 700;
      transition: transform 0.1s;
    }
    .tile:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,0.12); }

    /* The picture area fills the tile; the label sits in its own row below. */
    .tile .picture {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 0;
      margin-bottom: 3vmin;
    }
    .tile .label { line-height: 1; }

    /* Block Buddy icon: a tiny tower. */
    .tile .tower { --b: 6vmin; }

    /* Find Me icon: three numeral chips, one found. */
    .chips { display: flex; gap: 1.6vmin; align-items: center; }
    .chip {
      width: 8.5vmin;
      height: 8.5vmin;
      border-radius: 1.6vmin;
      color: white;
      font-size: 5.5vmin;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
      box-shadow: 0 0.6vmin 0 rgba(0,0,0,0.18);
    }
    .chip.found { transform: scale(1.15); box-shadow: 0 0 0 0.6vmin #fff, 0 0 0 1.2vmin #2b2b2b; }

    .tile.soon {
      opacity: 0.35;
      pointer-events: none;
      border: 1vmin dashed #bbb;
      background: transparent;
      box-shadow: none;
      justify-content: flex-end;
    }

    /* ---------- Parent view (long-press the title) ---------- */
    .parent {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vmin;
      padding: 4vmin;
      z-index: 30;
      font-size: 2.6vmin;
      color: #444;
    }
    .parent.show { display: flex; }
    .parent h2 { margin: 0; font-size: 4vmin; }
    .parent .sub { color: #777; margin: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 1vmin;
    }
    .cell {
      width: 8vmin;
      height: 8vmin;
      border-radius: 1.5vmin;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #e9e4d5;
      line-height: 1.1;
    }
    .cell b { font-size: 3vmin; }
    .cell small { font-size: 1.8vmin; opacity: 0.75; }
    .cell small.mix { font-size: 1.4vmin; color: #a33; opacity: 1; }
    .parent .sub { text-align: center; line-height: 1.4; }
    .cell.good { background: #bfe5bf; }
    .cell.okay { background: #f8ecb0; }
    .cell.weak { background: #f6c3bf; }
    .cell.mastered { outline: 0.5vmin solid #4aa84a; }
    .parent .row { display: flex; gap: 3vmin; align-items: center; flex-wrap: wrap; justify-content: center; }
    .parent button {
      font-size: 2.6vmin;
      padding: 1.6vmin 3vmin;
      border-radius: 2vmin;
      background: #ddd;
      color: #333;
    }
    .parent button.danger {
      background: #e4322b;
      color: white;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    /* hold-to-reset: a dark bar fills the button over the hold time */
    .parent button.danger .fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: rgba(0,0,0,0.3);
      transition: width 0s;
    }
    .parent button.danger.holding .fill { width: 100%; transition: width 1.2s linear; }
    .parent button.danger span { position: relative; }
    .parent button.undo { background: #4aa84a; color: white; }
    .parent button[hidden] { display: none; }
    .legend { display: flex; gap: 2vmin; color: #777; }
    .legend span::before { content: ''; display: inline-block; width: 1.8vmin; height: 1.8vmin; border-radius: 0.4vmin; margin-right: 0.6vmin; vertical-align: middle; }
    .legend .g::before { background: #bfe5bf; } .legend .o::before { background: #f8ecb0; } .legend .w::before { background: #f6c3bf; }
  </style>
</head>
<body>
  <h1 id="title">Ryn's Games</h1>
  <div class="tiles">
    <a class="tile" href="block-buddy/index.html">
      <div class="picture">
        <div class="tower">
          <div class="col">
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a"></div>
            <div class="block" style="--c:#4aa84a">
              <div class="face">
                <div class="eye left"><div class="pupil"></div></div>
                <div class="eye right"><div class="pupil"></div></div>
                <div class="mouth"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="label">Block Buddy</div>
    </a>
    <a class="tile" href="find-me/index.html">
      <div class="picture">
        <div class="chips">
          <div class="chip" style="background:#f5841f">2</div>
          <div class="chip found" style="background:#37b3e3">5</div>
          <div class="chip" style="background:#d63d8a">8</div>
        </div>
      </div>
      <div class="label">Find Me</div>
    </a>
    <div class="tile soon"><div class="label">coming soon</div></div>
  </div>

  <div class="parent" id="parent">
    <h2>Grown-up corner</h2>
    <p class="sub" id="rangeLine"></p>
    <div class="grid" id="grid"></div>
    <div class="legend"><span class="g">mostly right</span><span class="o">mixed</span><span class="w">struggling</span><span>green ring = mastered</span></div>
    <div class="row">
      <button id="closeBtn">Close</button>
      <button id="resetBtn" class="danger"><div class="fill"></div><span>Hold to reset progress</span></button>
      <button id="undoBtn" class="undo" hidden>Undo reset</button>
    </div>
  </div>

  <script src="shared/progress.js"></script>
  <script>
    (function () {
      document.addEventListener('contextmenu', e => e.preventDefault());

      const parentEl = document.getElementById('parent');
      const grid = document.getElementById('grid');
      const rangeLine = document.getElementById('rangeLine');
      const resetBtn = document.getElementById('resetBtn');
      const undoBtn = document.getElementById('undoBtn');

      function renderParent() {
        grid.innerHTML = '';
        Progress.all().forEach(s => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (s.seen > 0) {
            const rate = s.hits / s.seen;
            let tone = rate >= 0.8 ? 'good' : rate >= 0.5 ? 'okay' : 'weak';
            if (tone === 'good' && s.confused > s.hits) tone = 'okay'; // one lucky hit does not outweigh mix-ups
            cell.classList.add(tone);
          } else if (s.confused > 0) {
            cell.classList.add('okay'); // never asked, but she has mistaken it for others
          }
          if (s.mastered) cell.classList.add('mastered');
          const score = s.seen ? s.hits + '/' + s.seen : '–';
          const mix = s.confused ? '<small class="mix">' + s.confused + ' mix-up' + (s.confused === 1 ? '' : 's') + '</small>' : '';
          cell.innerHTML = '<b>' + s.n + '</b><small>' + score + '</small>' + mix;
          grid.appendChild(cell);
        });
        rangeLine.innerHTML = 'Find Me is asking about 1 to ' + Progress.range() + '.<br>' +
          'Score is first-try right / times asked. A mix-up is tapping that number when a different one was asked for.';
        undoBtn.hidden = !Progress.canUndoReset();
      }

      // Press-and-hold helper: fires after `ms` of continuous contact, cancels on release or drift.
      function holdToFire(el, ms, onFire, onState) {
        let timer = null;
        const start = e => {
          if (e.button !== undefined && e.button !== 0) return;
          if (onState) onState(true);
          timer = setTimeout(() => { timer = null; if (onState) onState(false); onFire(); }, ms);
        };
        const cancel = () => {
          if (timer) { clearTimeout(timer); timer = null; }
          if (onState) onState(false);
        };
        el.addEventListener('pointerdown', start);
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
      }

      // Long-press the title to open. A quick tap does nothing.
      holdToFire(document.getElementById('title'), 800, () => { renderParent(); parentEl.classList.add('show'); });

      // Reset needs a deliberate 1.2 s hold, and keeps one backup so it can be undone.
      holdToFire(resetBtn, 1200,
        () => { Progress.reset(); renderParent(); },
        holding => resetBtn.classList.toggle('holding', holding));
      resetBtn.addEventListener('click', e => e.preventDefault());
      undoBtn.addEventListener('click', () => { Progress.undoReset(); renderParent(); });

      document.getElementById('closeBtn').addEventListener('click', () => parentEl.classList.remove('show'));
      // Dev convenience: index.html?parent=1 opens the grown-up corner directly.
      if (new URLSearchParams(location.search).get('parent')) { renderParent(); parentEl.classList.add('show'); }
    })();
  </script>
</body>
</html>
