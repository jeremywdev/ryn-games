<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Find Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/blocks.css">
  <style>
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 18vmin 1fr;
      align-items: center;
      justify-items: center;
      padding: 2vmin 3vmin 4vmin;
    }

    /* ---------- "Say it again" button ---------- */
    .replay {
      width: 18vmin;
      height: 18vmin;
      border-radius: 50%;
      background: #f5841f;
      color: white;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s;
      margin-top: 4vmin;
    }
    .replay:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
    .replay svg { width: 55%; height: 55%; fill: white; }
    .replay.pulse { animation: pulse 1.2s ease-in-out infinite; }

    /* ---------- Hint: the target's blocks, shown after she gets stuck ---------- */
    .hint {
      height: 18vmin;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      visibility: hidden;
    }
    .hint.show { visibility: visible; }
    .hint .tower {
      border-bottom: 4px solid rgba(0,0,0,0.12);
      animation: rise 0.4s cubic-bezier(.3,1.4,.5,1);
      transform-origin: bottom center;
    }

    /* "Look" rounds: no number is spoken; a tower is the question and fills
       the space above the tiles. The speaker moves to the side. */
    .app.look { grid-template-rows: 1fr auto; position: relative; }
    .app.look .replay { position: absolute; left: 7vw; top: 22%; margin-top: 0; }

    /* "Count with me": offered in look rounds after a miss or a long quiet
       spell. Counting only starts when she taps it, and tiles stay live. */
    .helpcount {
      position: absolute;
      left: calc(7vw + 2vmin);
      top: calc(22% + 24vmin);
      width: 14vmin;
      height: 14vmin;
      border-radius: 50%;
      background: #37b3e3;
      color: white;
      font-size: 5vmin;
      font-weight: 700;
      letter-spacing: -0.2vmin;
      text-shadow: 0 0.3vmin 0 rgba(0,0,0,0.25);
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.15);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
      transition: opacity 0.3s, transform 0.3s, background 0.2s;
    }
    .app.look .helpcount.show { opacity: 1; pointer-events: auto; transform: scale(1); }
    .app.look .helpcount.show.pulse { animation: pulse 1.2s ease-in-out 2; }
    .helpcount.counting { background: #4aa84a; }
    .app.look .hint {
      height: 100%;
      width: 100%;
      visibility: visible;
      padding-bottom: 3vmin;
    }

    /* ---------- Answer tiles ---------- */
    .tiles {
      display: flex;
      gap: 4vmin;
      align-items: center;
      justify-content: center;
    }
    .tile {
      --c: #999;
      --accent: var(--c);     /* colour used once the tile is found; ten overrides it */
      width: 27vmin;
      height: 27vmin;
      border-radius: 4.5vmin;
      background: var(--c);
      border: 1.2vmin solid transparent;
      color: white;
      font-size: 16vmin;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0.5vmin 0 rgba(0,0,0,0.3);
      box-shadow: 0 1vmin 0 rgba(0,0,0,0.18), 0 1.2vmin 2.4vmin rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s, opacity 0.4s, box-shadow 0.12s;
    }
    .tile:active { transform: translateY(0.6vmin); box-shadow: 0 0.4vmin 0 rgba(0,0,0,0.18); }
    .tile.light { color: #333; text-shadow: 0 0.3vmin 0 rgba(255,255,255,0.6); }
    .tile.teen { background: #f7f7f7; }
    .tile.rainbow {
      background: linear-gradient(135deg,#e4322b,#f5841f,#f9d71c,#4aa84a,#37b3e3,#5c3ba6,#9b4dcf);
    }
    .tile.wrong { animation: shake 0.45s ease-in-out; }
    .tile.dim { opacity: 0.25; pointer-events: none; }
    .tile.nudge { animation: nudge 0.9s ease-in-out infinite; }
    .tile.right {
      pointer-events: none;
      background: white;
      border-color: var(--accent);
      animation: found 0.55s cubic-bezier(.3,1.6,.5,1) forwards;
    }
    /* once found, the numeral shrinks into the corner and the blocks take the stage,
       so symbol and quantity sit side by side */
    .tile.right .num {
      position: absolute;
      top: 1vmin;
      left: 2.2vmin;
      font-size: 7vmin;
      color: var(--accent);
      text-shadow: none;
    }
    .tile .reveal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2.5vmin;
    }
    .tile.right .reveal { display: flex; }
    .tile .reveal .tower {
      transform-origin: bottom center;
      animation: rise 0.4s cubic-bezier(.3,1.4,.5,1), hop 0.8s ease-in-out 0.45s infinite;
    }

    /* ---------- Start / end-of-set overlay ---------- */
    .party {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6vmin;
      z-index: 20;
    }
    .party.show { display: flex; }
    .party .lineup {
      display: flex;
      align-items: flex-end;
      gap: 2.5vmin;
      border-bottom: 6px solid rgba(0,0,0,0.12);
      padding: 0 4vmin;
      max-width: 94vw;
    }
    .party .lineup .tower { --b: 3.2vmin; animation: hop 0.9s ease-in-out infinite; transform-origin: bottom center; }
    .party .lineup .gap { width: 4vmin; }
    .play {
      width: 22vmin;
      height: 22vmin;
      border-radius: 50%;
      background: #4aa84a;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.15);
      position: relative;
    }
    .play::after {
      content: '';
      position: absolute;
      left: 56%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-left: 9vmin solid white;
      border-top: 6vmin solid transparent;
      border-bottom: 6vmin solid transparent;
    }
    .play:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }

    @keyframes found {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.2) rotate(-3deg); }
      70%  { transform: scale(1.05) rotate(2deg); }
      100% { transform: scale(1.08) rotate(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-2vmin) rotate(-3deg); }
      40% { transform: translateX(2vmin) rotate(3deg); }
      60% { transform: translateX(-1.5vmin) rotate(-2deg); }
      80% { transform: translateX(1.5vmin) rotate(2deg); }
    }
    @keyframes nudge {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1.5vmin) scale(1.04); }
    }
    @keyframes rise {
      0% { transform: scaleY(0.1); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-2vmin) scaleY(1.05); }
      50% { transform: translateY(0) scaleY(0.95); }
    }

    @media (orientation: portrait) {
      .tiles { flex-wrap: wrap; }
      .tile { width: 36vmin; height: 36vmin; font-size: 20vmin; }
    }
  </style>
</head>
<body>
  <a class="corner-btn home" href="../index.html" aria-label="Home">&#8962;</a>
  <button class="corner-btn fullscreen" id="fsBtn" aria-label="Fullscreen">&#x26F6;</button>

  <div class="app">
    <button class="replay" id="replayBtn" aria-label="Say it again">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/>
      </svg>
    </button>
    <button class="helpcount" id="helpBtn" aria-label="Count with me">123</button>
    <div class="hint" id="hint"><div class="tower" id="hintTower"></div></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="party" id="party">
    <div class="lineup" id="lineup"></div>
    <button class="play" id="playBtn" aria-label="Play"></button>
  </div>

  <script src="../shared/blocks.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/progress.js"></script>
  <script src="../shared/tap.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="../shared/count.js"></script>
  <script>
    (function () {
      const ROUNDS_PER_SET = 6;
      const tilesEl = document.getElementById('tiles');
      const replayBtn = document.getElementById('replayBtn');
      const hintEl = document.getElementById('hint');
      const hintTower = document.getElementById('hintTower');
      const helpBtn = document.getElementById('helpBtn');
      const partyEl = document.getElementById('party');
      const lineupEl = document.getElementById('lineup');
      const playBtn = document.getElementById('playBtn');
      const fsBtn = document.getElementById('fsBtn');
      const appEl = document.querySelector('.app');
      const params = new URLSearchParams(location.search);
      // Dev conveniences: ?demo=right|hint|party freezes a state; ?level=2 forces a level.
      const demo = params.get('demo');
      const forcedLevel = parseInt(params.get('level'), 10);

      // Levels: 1 hear the number, 2 see a tower and find its number, 3 a mix.
      const GAME = 'find-me';
      const MAX_LEVEL = 3;
      const CLEAN_ROUNDS_TO_ADVANCE = 8;
      let mode = 'say';           // this round: 'say' (hear it) or 'look' (count it)
      let runId = 0;              // bumps every round so stale counting callbacks stop

      let target = 0;
      let lastTarget = 0;
      let locked = true;          // true until the play button is tapped
      let wrongTaps = 0;
      let replayTaps = 0;
      let confusedThisRound = new Set();
      let roundsDone = 0;
      let found = [];
      let promptId = 0;           // so a stale prompt's end cannot clear a newer prompt's pulse
      const CHEERS = ['Yes!', 'Hooray!', 'You found it!', "That's it!", 'Wow!', 'Super!'];
      const IDLE_MS = 10000;
      const LOOK_HELP_MS = 20000;
      const LOOK_REPEAT_MS = 25000;
      let idleTimer = null;
      let idleRepeats = 0;
      let countId = 0;            // bumps to stop a count-along

      // If nothing happens for a while, help a little. In look rounds she may
      // be counting, so the game waits longer and never counts or points for her.
      function armIdle() {
        clearTimeout(idleTimer);
        if (locked) return;
        if (mode === 'look') {
          if (idleRepeats >= 2) return;
          idleTimer = setTimeout(() => {
            if (locked || counting()) return;
            idleRepeats++;
            if (idleRepeats === 1) { showHelp(); armIdle(); }
            else prompt();
          }, idleRepeats === 0 ? LOOK_HELP_MS : LOOK_REPEAT_MS);
          return;
        }
        idleTimer = setTimeout(() => {
          if (locked || idleRepeats >= 3) return;
          idleRepeats++;
          if (idleRepeats >= 2) showHint();
          prompt();
        }, IDLE_MS);
      }

      // ---- Count with me (look rounds, only when she asks) ----
      function showHelp() {
        if (mode !== 'look' || helpBtn.classList.contains('show')) return;
        helpBtn.classList.add('show', 'pulse');
        setTimeout(() => helpBtn.classList.remove('pulse'), 2600);
      }

      function counting() { return helpBtn.classList.contains('counting'); }

      function stopCount() {
        countId++;
        helpBtn.classList.remove('counting');
        document.querySelectorAll('.block.lit').forEach(b => b.classList.remove('lit'));
      }

      function countWithMe() {
        if (locked || mode !== 'look') return;
        stopCount();
        clearTimeout(idleTimer);
        promptId++;
        replayBtn.classList.remove('pulse');
        const id = countId, run = runId;
        helpBtn.classList.add('counting');
        Count.along(hintTower.querySelectorAll('.block'), {
          alive: () => id === countId && run === runId,
          onDone: () => {
            helpBtn.classList.remove('counting');
            prompt('', 'Find ' + Blocks.WORDS[target] + '!');
          }
        });
      }

      // ---- Speech ----
      function promptText() {
        return mode === 'look' ? 'How many blocks? Find the number!' : 'Find ' + Blocks.WORDS[target] + '.';
      }

      /** Say (prefix +) "Find six." and pulse the replay button until it finishes. */
      function prompt(prefix, text) {
        const id = ++promptId;
        replayBtn.classList.add('pulse');
        GameAudio.say((prefix || '') + (text || promptText()), {
          onEnd: () => { if (id === promptId) replayBtn.classList.remove('pulse'); }
        });
        armIdle();
      }

      // ---- Round setup ----
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Distractors, in priority order: a number she has actually mixed up with
      // this one, then (half the time) a neighbour, then random fill.
      function pickChoices(t, max, count) {
        const picks = new Set();
        const partner = Progress.confusedWith(t).find(p => p.n >= 1 && p.n <= max && p.n !== t);
        if (partner && Math.random() < 0.7) picks.add(partner.n);
        if (Math.random() < 0.5) {
          const nb = shuffle([t - 1, t + 1].filter(x => x >= 1 && x <= max && !picks.has(x)));
          if (nb.length && picks.size < count - 1) picks.add(nb[0]);
        }
        const pool = [];
        for (let i = 1; i <= max; i++) if (i !== t && !picks.has(i)) pool.push(i);
        shuffle(pool).forEach(x => { if (picks.size < count - 1) picks.add(x); });
        return shuffle([t, ...picks]);
      }

      function styleTile(tile, n) {
        tile.className = 'tile';
        tile.style.borderColor = '';
        if (n === 7) {
          tile.classList.add('rainbow');
          tile.style.setProperty('--c', '#5c3ba6');
        } else if (n > 10) {
          tile.classList.add('teen', 'light');
          tile.style.setProperty('--c', n === 20 ? '#8c8c8c' : Blocks.numberColor(n - 10));
          tile.style.borderColor = 'var(--c)';
        } else {
          const c = Blocks.numberColor(n);
          tile.style.setProperty('--c', c);
          if (Blocks.isLight(c)) tile.classList.add('light');
        }
        // Ten is white: its found-state numeral and border need a visible colour.
        tile.style.setProperty('--accent', n === 10 ? '#777' : 'var(--c)');
      }

      function currentLevel() {
        const l = Number.isFinite(forcedLevel) ? forcedLevel : Progress.getLevel(GAME);
        return Math.max(1, Math.min(MAX_LEVEL, l));
      }

      function newRound(prefix) {
        const max = Progress.range();
        const count = max <= 5 ? 3 : 4;
        target = Progress.pickTarget(Array.from({ length: max }, (_, i) => i + 1), lastTarget);
        lastTarget = target;
        runId++;
        const level = currentLevel();
        mode = level === 1 ? 'say' : level === 2 ? 'look' : (Math.random() < 0.5 ? 'say' : 'look');
        appEl.classList.toggle('look', mode === 'look');
        locked = false;
        wrongTaps = 0;
        replayTaps = 0;
        idleRepeats = 0;
        stopCount();
        helpBtn.classList.remove('show', 'pulse');
        confusedThisRound = new Set();
        hideHint();

        tilesEl.innerHTML = '';
        pickChoices(target, max, count).forEach(n => {
          const tile = document.createElement('button');
          styleTile(tile, n);
          tile.innerHTML = '<span class="num">' + n + '</span><div class="reveal"><div class="tower"></div></div>';
          tile.dataset.n = n;
          Tap.on(tile, () => { GameAudio.unlock(); onTap(tile, n); });
          tilesEl.appendChild(tile);
        });
        if (mode === 'look') drawQuestionTower();
        prompt(prefix);
      }

      // The question in a look round: the target's tower, as big as the space allows.
      function drawQuestionTower() {
        const rows = Math.min(target, 10);
        const room = hintEl.clientHeight - 30;
        const b = Math.max(14, Math.min(room / (rows + 0.5), 70));
        hintTower.style.setProperty('--b', b + 'px');
        Blocks.render(hintTower, target);
        hintEl.classList.add('show');
      }

      // ---- Hints: escalate gently instead of letting her guess forever ----
      function fitTower(el, n, maxHeightVmin, maxBlock) {
        const rows = Math.min(n, 10);
        el.style.setProperty('--b', Math.min(maxBlock, maxHeightVmin / (rows + 0.5)) + 'vmin');
        Blocks.render(el, n);
      }

      function showHint() {
        if (mode === 'look' || hintEl.classList.contains('show')) return;
        fitTower(hintTower, target, 15, 5);
        hintEl.classList.add('show');
      }

      function hideHint() {
        if (mode !== 'look') hintEl.classList.remove('show');
        tilesEl.querySelectorAll('.tile.nudge').forEach(t => t.classList.remove('nudge'));
      }

      function nudgeTarget() {
        const t = tilesEl.querySelector('[data-n="' + target + '"]');
        if (t) t.classList.add('nudge');
      }

      // ---- Answers ----
      function onTap(tile, n) {
        if (locked) return;
        clearTimeout(idleTimer);
        stopCount();              // any tap ends a count-along; it counts as her answer
        if (n === target) {
          locked = true;
          promptId++;
          replayBtn.classList.remove('pulse');
          Progress.record(target, wrongTaps === 0);
          Progress.recordLevelRound(GAME, wrongTaps === 0, CLEAN_ROUNDS_TO_ADVANCE, MAX_LEVEL);
          runId++;                // stops a count-along that is still going
          found.push(target);
          hideHint();
          tile.classList.add('right');
          fitTower(tile.querySelector('.tower'), n, 21, 7);
          tilesEl.querySelectorAll('.tile').forEach(t => { if (t !== tile) t.classList.add('dim'); });
          GameAudio.chime();
          FX.burstFrom(tile);
          const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
          // Move on when the phrase is done; if something cut it off, still move on.
          GameAudio.say(cheer + ' ' + Blocks.phrase(target), { onDone: () => setTimeout(nextRound, 700) });
          return;
        }

        wrongTaps++;
        // A miscount is not a numeral mix-up, so only "hear it" rounds record pairs.
        if (mode === 'say' && !confusedThisRound.has(n)) {
          confusedThisRound.add(n);
          Progress.recordConfusion(n, target);
        }
        tile.classList.remove('wrong');
        void tile.offsetWidth;
        tile.classList.add('wrong');
        // A wrong tile fades out so she narrows down instead of mashing it.
        const fadeRun = runId;
        setTimeout(() => { if (fadeRun === runId) tile.classList.add('dim'); }, 450);
        GameAudio.nope();

        if (mode === 'look') {
          // Offer the count button; never start counting for her.
          showHelp();
          prompt("That's " + Blocks.WORDS[n] + '.' + (wrongTaps === 1 ? ' Count the blocks! ' : ' '));
        } else if (wrongTaps === 1) {
          prompt("That's " + Blocks.WORDS[n] + '. ');
        } else {
          // Second miss: show the quantity as a clue and make the right tile bob.
          showHint();
          nudgeTarget();
          prompt("That's " + Blocks.WORDS[n] + '. Look! ');
        }
      }

      function nextRound() {
        if (demo) return; // hold the demo state still for screenshots
        roundsDone++;
        if (roundsDone >= ROUNDS_PER_SET) { endSet(); return; }
        newRound();
      }

      // ---- Start / end of set ----
      function lineup(numbers, newOnes) {
        lineupEl.innerHTML = '';
        const cols = numbers.concat(newOnes).reduce((a, n) => a + Blocks.columns(n).length, 0);
        const b = Math.max(1.5, Math.min(3.2, 70 / (cols * 1.45)));
        const add = (n, i, extra) => {
          const t = document.createElement('div');
          t.className = 'tower' + (extra ? ' ' + extra : '');
          t.style.setProperty('--b', b + 'vmin');
          t.style.animationDelay = (i * 0.12) + 's';
          Blocks.render(t, n);
          lineupEl.appendChild(t);
        };
        numbers.forEach((n, i) => add(n, i));
        if (newOnes.length) {
          const gap = document.createElement('div');
          gap.className = 'gap';
          lineupEl.appendChild(gap);
          newOnes.forEach((n, i) => add(n, numbers.length + i, 'new'));
        }
      }

      function endSet() {
        locked = true;
        clearTimeout(idleTimer);
        const unlocked = Progress.takeUnlock();
        const levelUp = Progress.takeLevelUp(GAME);
        const newOnes = [];
        if (unlocked) for (let i = unlocked === 20 ? 11 : 6; i <= unlocked; i++) newOnes.push(i);
        lineup(found, newOnes);
        partyEl.classList.add('show');
        GameAudio.chime();
        setTimeout(() => GameAudio.chime(), 350);
        const cx = window.innerWidth / 2, cy = window.innerHeight * 0.38;
        FX.burst(cx - window.innerWidth * 0.18, cy, { count: 40, spread: 320 });
        setTimeout(() => FX.burst(cx + window.innerWidth * 0.18, cy, { count: 40, spread: 320 }), 300);
        setTimeout(() => FX.burst(cx, cy - 40, { count: 50, spread: 400 }), 700);
        GameAudio.say(newOnes.length
          ? 'You found them all! Now some bigger numbers want to play!'
          : levelUp === 2 ? 'You found them all! Next time, count the blocks to find the number!'
          : levelUp === 3 ? 'You found them all! Next time, listen or count. Get ready!'
          : 'You found them all!');
      }

      function startSet(prefix) {
        partyEl.classList.remove('show');
        roundsDone = 0;
        found = [];
        newRound(prefix);
      }

      function showStart() {
        lineup([1, 2, 3], []);
        partyEl.classList.add('show');
      }

      // ---- Wire up ----
      // The play button is the first tap: it unlocks sound and speech for the rest of the visit.
      let started = false;
      Tap.on(playBtn, () => {
        GameAudio.unlock();
        startSet(started ? '' : "Let's find some numbers! ");
        started = true;
      });
      Tap.on(replayBtn, () => {
        if (locked) return; // not while a round is resolving or before play
        GameAudio.unlock();
        replayTaps++;
        stopCount();
        if (replayTaps >= 2) { if (mode === 'look') showHelp(); else showHint(); } // asked twice: offer more help
        prompt();
      });
      Tap.on(helpBtn, () => { GameAudio.unlock(); countWithMe(); });
      fsBtn.addEventListener('click', () => {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      });
      document.addEventListener('contextmenu', e => e.preventDefault());

      GameAudio.ready(() => {
        showStart();
        if (!demo) return;
        startSet('');
        const t = tilesEl.querySelector('[data-n="' + target + '"]');
        if (demo === 'right' && t) {
          onTap(t, target);
        } else if (demo === 'hint') {
          const wrong = Array.from(tilesEl.querySelectorAll('.tile')).filter(x => x !== t);
          wrong.slice(0, 2).forEach(w => onTap(w, Number(w.dataset.n)));
        } else if (demo === 'party') {
          found = [3, 7, 12, 5, 20, 9];
          endSet();
        }
      });
    })();
  </script>
</body>
</html>
