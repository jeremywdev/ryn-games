<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Find Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/blocks.css">
  <style>
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      align-items: center;
      justify-items: center;
      padding: 2vmin 3vmin 4vmin;
    }

    /* ---------- "Say it again" button ---------- */
    .replay {
      width: 18vmin;
      height: 18vmin;
      border-radius: 50%;
      background: #f5841f;
      color: white;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s;
      margin-top: 4vmin;
    }
    .replay:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
    .replay svg { width: 55%; height: 55%; fill: white; }
    .replay.pulse { animation: pulse 1.2s ease-in-out infinite; }

    /* ---------- Answer tiles ---------- */
    .tiles {
      display: flex;
      gap: 4vmin;
      align-items: center;
      justify-content: center;
    }
    .tile {
      --c: #999;
      width: 27vmin;
      height: 27vmin;
      border-radius: 4.5vmin;
      background: var(--c);
      border: 1.2vmin solid transparent;
      color: white;
      font-size: 16vmin;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0.5vmin 0 rgba(0,0,0,0.3);
      box-shadow: 0 1vmin 0 rgba(0,0,0,0.18), 0 1.2vmin 2.4vmin rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s, opacity 0.4s, box-shadow 0.12s;
    }
    .tile:active { transform: translateY(0.6vmin); box-shadow: 0 0.4vmin 0 rgba(0,0,0,0.18); }
    .tile.light { color: #333; text-shadow: 0 0.3vmin 0 rgba(255,255,255,0.6); }
    .tile.teen { background: #f7f7f7; }
    .tile.rainbow {
      background: linear-gradient(135deg,#e4322b,#f5841f,#f9d71c,#4aa84a,#37b3e3,#5c3ba6,#9b4dcf);
    }
    .tile.wrong { animation: shake 0.45s ease-in-out; }
    .tile.dim { opacity: 0.25; pointer-events: none; }
    .tile.right {
      pointer-events: none;
      transform: scale(1.08);
      background: white;
      border-color: var(--c);
    }
    /* once found, the numeral shrinks into the corner and the blocks take the stage,
       so symbol and quantity sit side by side */
    .tile.right .num {
      position: absolute;
      top: 1vmin;
      left: 2.2vmin;
      font-size: 7vmin;
      color: var(--c);
      text-shadow: none;
    }
    .tile .reveal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2.5vmin;
    }
    .tile.right .reveal { display: flex; }
    .tile .reveal .tower { animation: rise 0.4s cubic-bezier(.3,1.4,.5,1); transform-origin: bottom center; }

    /* ---------- End-of-set celebration ---------- */
    .party {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6vmin;
      z-index: 20;
    }
    .party.show { display: flex; }
    .party .lineup {
      display: flex;
      align-items: flex-end;
      gap: 3vmin;
      border-bottom: 6px solid rgba(0,0,0,0.12);
      padding: 0 4vmin;
    }
    .party .lineup .tower { --b: 3.2vmin; animation: hop 0.9s ease-in-out infinite; transform-origin: bottom center; }
    .play {
      width: 22vmin;
      height: 22vmin;
      border-radius: 50%;
      background: #4aa84a;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 18px rgba(0,0,0,0.15);
      position: relative;
    }
    .play::after {
      content: '';
      position: absolute;
      left: 56%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-left: 9vmin solid white;
      border-top: 6vmin solid transparent;
      border-bottom: 6vmin solid transparent;
    }
    .play:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-2vmin) rotate(-3deg); }
      40% { transform: translateX(2vmin) rotate(3deg); }
      60% { transform: translateX(-1.5vmin) rotate(-2deg); }
      80% { transform: translateX(1.5vmin) rotate(2deg); }
    }
    @keyframes rise {
      0% { transform: scaleY(0.1); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-2vmin) scaleY(1.05); }
      50% { transform: translateY(0) scaleY(0.95); }
    }

    @media (orientation: portrait) {
      .tiles { flex-wrap: wrap; }
      .tile { width: 36vmin; height: 36vmin; font-size: 20vmin; }
    }
  </style>
</head>
<body>
  <a class="corner-btn home" href="../index.html" aria-label="Home">&#8962;</a>
  <button class="corner-btn fullscreen" id="fsBtn" aria-label="Fullscreen">&#x26F6;</button>

  <div class="app">
    <button class="replay" id="replayBtn" aria-label="Say it again">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/>
      </svg>
    </button>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="party" id="party">
    <div class="lineup" id="lineup"></div>
    <button class="play" id="againBtn" aria-label="Play again"></button>
  </div>

  <script src="../shared/blocks.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/progress.js"></script>
  <script>
    (function () {
      const ROUNDS_PER_SET = 6;
      const tilesEl = document.getElementById('tiles');
      const replayBtn = document.getElementById('replayBtn');
      const partyEl = document.getElementById('party');
      const lineupEl = document.getElementById('lineup');
      const againBtn = document.getElementById('againBtn');
      const fsBtn = document.getElementById('fsBtn');

      let target = 0;
      let lastTarget = 0;
      let locked = false;
      let missesThisRound = 0;
      let roundsDone = 0;
      let found = [];
      let promptPending = false; // browser refused to speak before a tap
      // Dev convenience: find-me/?demo=right shows a solved round, ?demo=party the set finish.
      const demo = new URLSearchParams(location.search).get('demo');

      // ---- Speech helpers ----
      function promptText() { return 'Find ' + Blocks.WORDS[target] + '.'; }

      function prompt() {
        replayBtn.classList.add('pulse');
        GameAudio.say(promptText(), {
          onError: code => { if (code === 'not-allowed') promptPending = true; },
          onEnd: () => replayBtn.classList.remove('pulse')
        });
      }

      // Speak feedback; if the prompt itself was blocked, say it first.
      function speak(text, opts) {
        if (promptPending) {
          promptPending = false;
          GameAudio.say(promptText());
          GameAudio.say(text, Object.assign({ queue: true }, opts || {}));
        } else {
          GameAudio.say(text, opts);
        }
      }

      // ---- Round setup ----
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function pickChoices(t, max, count) {
        const pool = [];
        for (let i = 1; i <= max; i++) if (i !== t) pool.push(i);
        const picks = new Set();
        // Half the time include a neighbour, since 5/6 or 13/14 is the real test.
        if (Math.random() < 0.5) {
          const nb = shuffle([t - 1, t + 1].filter(x => x >= 1 && x <= max));
          if (nb.length) picks.add(nb[0]);
        }
        shuffle(pool).forEach(x => { if (picks.size < count - 1) picks.add(x); });
        return shuffle([t, ...picks]);
      }

      function styleTile(tile, n) {
        tile.className = 'tile';
        if (n === 7) {
          tile.classList.add('rainbow');
          tile.style.setProperty('--c', '#5c3ba6');
        } else if (n > 10) {
          tile.classList.add('teen', 'light');
          tile.style.setProperty('--c', n === 20 ? '#8c8c8c' : Blocks.numberColor(n - 10));
          tile.style.borderColor = 'var(--c)';
        } else {
          const c = Blocks.numberColor(n);
          tile.style.setProperty('--c', c);
          if (Blocks.isLight(c)) tile.classList.add('light');
        }
      }

      function newRound() {
        const max = Progress.range();
        const count = max <= 5 ? 3 : 4;
        target = Progress.pickTarget(Array.from({ length: max }, (_, i) => i + 1), lastTarget);
        lastTarget = target;
        locked = false;
        missesThisRound = 0;

        tilesEl.innerHTML = '';
        pickChoices(target, max, count).forEach(n => {
          const tile = document.createElement('button');
          styleTile(tile, n);
          tile.innerHTML = '<span class="num">' + n + '</span><div class="reveal"><div class="tower"></div></div>';
          tile.dataset.n = n;
          tile.addEventListener('click', () => { GameAudio.unlock(); onTap(tile, n); });
          tilesEl.appendChild(tile);
        });
        prompt();
      }

      // ---- Answers ----
      function onTap(tile, n) {
        if (locked) return;
        if (n === target) {
          locked = true;
          Progress.record(target, missesThisRound === 0);
          found.push(target);
          revealTower(tile, n);
          tilesEl.querySelectorAll('.tile').forEach(t => { if (t !== tile) t.classList.add('dim'); });
          GameAudio.chime();
          speak(Blocks.phrase(target), { onEnd: () => setTimeout(nextRound, 600) });
        } else {
          missesThisRound++;
          Progress.record(target, false);
          tile.classList.remove('wrong');
          void tile.offsetWidth;
          tile.classList.add('wrong');
          GameAudio.nope();
          speak("That's " + Blocks.WORDS[n] + '. ' + promptText());
        }
      }

      function revealTower(tile, n) {
        tile.classList.add('right');
        const tower = tile.querySelector('.tower');
        // Size blocks to the number: small numbers get big blocks, ten-high columns still fit.
        const rows = Math.min(n, 10);
        const b = Math.min(7, 21 / (rows + 0.5));
        tower.style.setProperty('--b', b + 'vmin');
        Blocks.render(tower, n);
      }

      function nextRound() {
        if (demo) return; // hold the demo state still for screenshots
        roundsDone++;
        if (roundsDone >= ROUNDS_PER_SET) { endSet(); return; }
        newRound();
      }

      // ---- End of set ----
      function endSet() {
        lineupEl.innerHTML = '';
        found.forEach((n, i) => {
          const t = document.createElement('div');
          t.className = 'tower';
          t.style.animationDelay = (i * 0.12) + 's';
          Blocks.render(t, n);
          lineupEl.appendChild(t);
        });
        partyEl.classList.add('show');
        GameAudio.chime();
        setTimeout(() => GameAudio.chime(), 350);
        speak('You found them all!');
      }

      function startSet() {
        partyEl.classList.remove('show');
        roundsDone = 0;
        found = [];
        newRound();
      }

      // ---- Wire up ----
      replayBtn.addEventListener('click', () => { GameAudio.unlock(); promptPending = false; prompt(); });
      againBtn.addEventListener('click', () => { GameAudio.unlock(); startSet(); });
      fsBtn.addEventListener('click', () => {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      });
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('touchstart', () => GameAudio.unlock(), { once: true, passive: true });

      GameAudio.ready(() => {
        GameAudio.unlock();
        startSet();
        if (demo === 'right') {
          const t = tilesEl.querySelector('[data-n="' + target + '"]');
          if (t) onTap(t, target);
        } else if (demo === 'party') {
          found = [3, 7, 12, 5, 20, 9];
          endSet();
        }
      });
    })();
  </script>
</body>
</html>
